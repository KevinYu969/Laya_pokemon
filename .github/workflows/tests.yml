name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy Pillow imageio imageio-ffmpeg
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/backup_project.py --validate-only
